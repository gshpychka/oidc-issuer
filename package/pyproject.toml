[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oidc-issuer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cryptography"]

[project.scripts]
oidc-issuer = "oidc_issuer.signer:main"
oidc-token = "oidc_issuer.client:main"

[tool.setuptools.packages.find]
where = ["src"]
